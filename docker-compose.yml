version: "3.9"

services:
  # ─── FastAPI ML Backend ──────────────────────────────────────
  api:
    build: .
    container_name: nsx-api
    command: >
      python -m uvicorn api:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
    ports:
      - "8000:8000"
    volumes:
      - ./studio_x.db:/app/studio_x.db        # Persist SQLite DB
      - ./model_*.pkl:/app/model_*.pkl || true  # Persist trained models
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - API_KEY=${API_KEY:-nsx-dev-key-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── React Frontend ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: nsx-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
