version: "3.9"

services:
  # ─── FastAPI ML Backend ──────────────────────────────────────
  api:
    build: .
    container_name: nsx-api
    command: >
      python -m uvicorn api:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
    ports:
      - "8000:8000"
    volumes:
      - ./studio_x.db:/app/studio_x.db        # Persist SQLite DB
      - ./model_*.pkl:/app/model_*.pkl || true  # Persist trained models
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - API_KEY=${API_KEY:-nsx-dev-key-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Streamlit Frontend ──────────────────────────────────────
  frontend:
    build: .
    container_name: nsx-frontend
    command: >
      python -m streamlit run app.py
      --server.port 8501
      --server.headless true
      --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./studio_x.db:/app/studio_x.db
      - ./model_*.pkl:/app/model_*.pkl || true
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - API_BASE_URL=http://api:8000   # Internal Docker network URL
      - COOKIE_SECRET=${COOKIE_SECRET:-nsx-super-secret-key-change-in-prod}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
